services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: growth, POSTGRES_USER: growth, POSTGRES_PASSWORD: growth }
    ports: ["5432:5432"]
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    ports: ["8000:8000"]
  app:
    build: .
    depends_on: [postgres, kafka, dynamodb]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/growth
      KAFKA_BOOTSTRAP: kafka:9092
      DYNAMODB_ENDPOINT: http://dynamodb:8000
    ports: ["8080:8080"]
    restart: on-failure
